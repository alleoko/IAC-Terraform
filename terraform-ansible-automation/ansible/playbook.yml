- hosts: all
  become: yes
  tasks:
    - name: Install Nginx
      yum:
        name: nginx
        state: present

    - name: Copy index page
      copy:
        src: index.html
        dest: /usr/share/nginx/html/index.html

    - name: Start Nginx
      service:
        name: nginx
        state: started
        enabled: yes

